id: sysaid-panel

info:
  name: SysAid - Panel
  author: pdteam,darses
  severity: info
  description: |
    SysAid login panel was detected.
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
    cpe: cpe:2.3:a:sysaid:sysaid:*:*:*:*:*:*:*:*
  metadata:
    verified: true
    max-requests: 3
    vendor: sysaid
    product: sysaid
    shodan-query: http.favicon.hash:1540720428
    fofa-query: icon_hash=1540720428
  tags: detect,panel,sysaid,helpdesk,discovery,version

http:
  - method: GET
    path:
      - "{{BaseURL}}/Login.jsp"
      - "{{BaseURL}}/InvalidAccount.jsp"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        words:
          - "<title>SysAid Help Desk Software</title>"
          - "mailto:info@sysaid.com"
          - "css/identity/sysaid_logo.png"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        name: version
        part: body
        group: 2
        regex:
          - "(ajaxTools\\.js|master\\.css)\\?v([\\d\\.\\w]+)\""
